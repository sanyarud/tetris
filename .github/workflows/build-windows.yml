name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: tetris_cpp

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg packages
        run: |
          vcpkg install sdl2 sdl2-ttf sdl2-mixer --triplet x86-windows

      - name: List available libs
        shell: pwsh
        run: |
          Get-ChildItem C:\vcpkg\installed\x86-windows\lib\*.lib | Select-Object Name

      - name: Build with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cl.exe /std:c++17 /O2 /EHsc /D_USE_MATH_DEFINES /DSDL_MAIN_HANDLED ^
            /I "C:\vcpkg\installed\x86-windows\include" ^
            /I "C:\vcpkg\installed\x86-windows\include\SDL2" ^
            main.cpp ^
            /Fe:tetris.exe ^
            /link /LIBPATH:"C:\vcpkg\installed\x86-windows\lib" ^
            SDL2.lib SDL2_ttf.lib SDL2_mixer.lib shell32.lib ^
            /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup

      - name: Collect DLLs and create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item tetris.exe release/
          Copy-Item C:\vcpkg\installed\x86-windows\bin\SDL2.dll release/
          Copy-Item C:\vcpkg\installed\x86-windows\bin\SDL2_ttf.dll release/
          Copy-Item C:\vcpkg\installed\x86-windows\bin\SDL2_mixer.dll release/
          Get-ChildItem C:\vcpkg\installed\x86-windows\bin\*.dll | Where-Object {
            $_.Name -match 'freetype|zlib|harfbuzz|bz2|brotli|png|ogg|vorbis|mpg|flac'
          } | Copy-Item -Destination release/
          Compress-Archive -Path release/* -DestinationPath Tetris-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-Windows
          path: tetris_cpp/release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tetris_cpp/Tetris-Windows.zip
          generate_release_notes: true
